# ============================================================
# Docker Compose for Inventory Backend
# ============================================================
# Usage:
#   Development:  docker compose up db
#   Full stack:   docker compose up
#   Build & run:  docker compose up --build
# ============================================================

services:
  # ----------------------------------------------------------
  # Application
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=inventory
      - DB_USERNAME=inventory
      - DB_PASSWORD=inventory
      - JWT_SECRET=your-production-secret-key-change-this-in-production-at-least-32-characters
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - inventory-network

  # ----------------------------------------------------------
  # Database
  # ----------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - inventory-network

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  postgres-data:
    driver: local

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  inventory-network:
    driver: bridge
